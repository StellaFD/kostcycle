services:
  catalog:
    image: ${CATALOG_IMAGE:-kostcycle-catalog:local}
    build: .
    restart: unless-stopped
    ports:
      - "80:8000"
    env_file: .env
    environment:
      SERVICE: catalog
      RESERVATION_URL: http://reservation:8000
    depends_on:
      reservation:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  reservation:
    image: ${RESERVATION_IMAGE:-kostcycle-reservation:local}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE: reservation
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
